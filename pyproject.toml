[project]
name = "fedbio"
version = "0.0.1"
description = "Federated learning for biological data. BioDATA ASCENT hackathon, CSHL, Nov 2026."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr[simulation]==1.42.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "scanpy",
    "anndata",
    "matplotlib",
    "requests",
    "lifelines",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
