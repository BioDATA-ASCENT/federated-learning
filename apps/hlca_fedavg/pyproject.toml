[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlca-fedavg"
version = "0.1.0"
description = "Federated cell type classification on the Human Lung Cell Atlas"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr[simulation]==1.42.0",
    "torch",
    "scanpy",
    "anndata",
    "numpy",
    "umap-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["hlca_fedavg"]

[tool.flwr.app]
publisher = "biodata-ascent"

[tool.flwr.app.components]
serverapp = "hlca_fedavg.server_app:app"
clientapp = "hlca_fedavg.client_app:app"

# Override at submit time, e.g.
#   flwr run apps/hlca_fedavg --stream -c 'num-server-rounds=10 local-epochs=2'
[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1          # keep this low: averaged hidden units drift apart
batch-size = 128
lr = 0.05
momentum = 0.9
hidden-size = 256
val-fraction = 0.2        # held out per client, by donor where the column exists
min-nodes = 6             # one per lab group
seed = 42
# Each node holds its own copy. The app does not run in the repository, so a
# path relative to the repository does not resolve.
data-dir = "~/fedbio-data/hlca"      # client_<k>.h5ad, raw counts over the contract genes
gene-list = "~/fedbio-data/hlca/genes.txt"
evaluation-file = "~/fedbio-data/hlca/evaluation.h5ad"
init-model = ""           # path to a warm start state_dict, empty for a cold start
out-dir = "~/fedbio-runs/hlca_fedavg"
check-only = false        # true: ask every connected node whether it can train, then stop
check-timeout-seconds = 120

# The supernode count is no longer set here. Flower 1.42 keeps it with the
# federation:
#   flwr federation simulation-config @none/default --num-supernodes 6
