[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-smoke-test"
version = "0.1.0"
description = "Two-client Flower deployment smoke test"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr==1.42.0",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["smoke_test"]

[tool.flwr.app]
publisher = "biodata-ascent"

[tool.flwr.app.components]
serverapp = "smoke_test.server_app:app"
clientapp = "smoke_test.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
